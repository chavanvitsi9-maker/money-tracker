<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Pen & Coin Graphic -->
  <g filter="url(#shadow)" fill="#ffffff" transform="translate(40, 30)">
    <!-- Ledger Book / Card shape -->
    <rect x="60" y="80" width="312" height="280" rx="36" fill="#ffffff" fill-opacity="0.95" />
    <rect x="90" y="130" width="140" height="24" rx="12" fill="#e0e7ff" />
    <rect x="90" y="174" width="200" height="18" rx="9" fill="#f1f5f9" />
    <rect x="90" y="206" width="160" height="18" rx="9" fill="#f1f5f9" />
    <rect x="90" y="238" width="180" height="18" rx="9" fill="#f1f5f9" />
    
    <!-- Accent Green and Red Pills -->
    <rect x="90" y="280" width="70" height="26" rx="13" fill="#10b981" />
    <rect x="170" y="280" width="70" height="26" rx="13" fill="#f43f5e" />

    <!-- Coin Badge -->
    <circle cx="320" cy="270" r="56" fill="url(#coinGrad)" stroke="#ffffff" stroke-width="6" />
    <text x="320" y="288" font-family="'Prompt', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">฿</text>
  </g>
</svg>
